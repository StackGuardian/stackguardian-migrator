[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sg-git-scan"
version = "0.1.0"
description = "Scan Git repositories for Terraform and generate StackGuardian bulk workflow payloads"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "python-hcl2>=4.3.0",
]

[project.scripts]
sg-git-scan = "sg_git_scan.cli:main"
